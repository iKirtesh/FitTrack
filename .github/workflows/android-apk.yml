name: Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: APK build type
        required: true
        type: choice
        options:
          - preview
          - development
        default: preview

jobs:
  build:
    name: Build FitTrack Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create or link the Expo project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ACCOUNT: ${{ vars.EXPO_ACCOUNT }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add EXPO_TOKEN as a GitHub Actions repository secret."
            exit 1
          fi
          if [ -z "$EXPO_ACCOUNT" ]; then
            echo "::error::Add EXPO_ACCOUNT as a GitHub Actions repository variable (your Expo account username)."
            exit 1
          fi
          npx eas-cli@latest init --account "$EXPO_ACCOUNT" --non-interactive

      - name: Install development client (development APK only)
        if: inputs.profile == 'development'
        run: npx expo install expo-dev-client

      - name: Build Android APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile "${{ inputs.profile }}" --non-interactive
