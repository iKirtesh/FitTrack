name: Build Android APK

# Builds an installable APK in GitHub's cloud and publishes it as a GitHub Release.
# Run it from the Actions tab ("Run workflow"), or it runs on every push to main.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner already ships the Android SDK (ANDROID_HOME).

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      # Android only installs an APK over an existing one when the signing key matches and
      # versionCode is higher, so every build gets a larger number than the last.
      - name: Bump Android versionCode
        run: |
          node -e "
          const fs=require('fs');const c=JSON.parse(fs.readFileSync('app.json','utf8'));
          c.expo.android.versionCode=1000+Number(process.env.GITHUB_RUN_NUMBER);
          fs.writeFileSync('app.json',JSON.stringify(c,null,2));
          console.log('versionCode',c.expo.android.versionCode)"

      # Over-the-air updates through EAS Update. Needs the EXPO_TOKEN repository secret; without it the
      # APK is still built, just with OTA turned off.
      - name: Configure OTA updates (EAS)
        id: ota
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "EXPO_TOKEN not set, OTA disabled"; exit 1; fi
          npx --yes eas-cli@latest init --force --non-interactive
          npx --yes eas-cli@latest update:configure --non-interactive || true
          node -e "const c=require('./app.json').expo; if(!(c.updates&&c.updates.url)){console.error('no updates.url');process.exit(1)}"

      - name: Turn OTA off if it could not be configured
        if: steps.ota.outcome != 'success'
        run: |
          node -e "
          const fs=require('fs');const c=JSON.parse(fs.readFileSync('app.json','utf8'));
          c.expo.updates={enabled:false};delete c.expo.runtimeVersion;
          fs.writeFileSync('app.json',JSON.stringify(c,null,2));"

      # Published before prebuild so the runtime fingerprint matches the one baked into the APK.
      - name: Publish OTA update (EAS Update)
        if: steps.ota.outcome == 'success'
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest update --channel main --platform android --message "${{ github.sha }}" --non-interactive

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Build release APK (arm64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Name the APK
        run: |
          SHORT=$(git rev-parse --short HEAD)
          cp android/app/build/outputs/apk/release/app-release.apk "FitTrack-${SHORT}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "FitTrack-latest.apk"
          ls -lh FitTrack-*.apk
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-apk
          path: FitTrack-*.apk
          retention-days: 30

      - name: Publish a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: FitTrack APK build ${{ github.run_number }} (${{ env.SHORT }})
          body: |
            Android APK built from commit ${{ github.sha }}.

            **Install:** open this release on your phone, download `FitTrack-latest.apk`, open it, and allow "Install unknown apps" for your browser when asked.
            Signed with the standard Expo debug key, so it is for personal sideloading, not the Play Store. Later builds install over earlier ones and keep your data.
          files: |
            FitTrack-${{ env.SHORT }}.apk
            FitTrack-latest.apk
          make_latest: true
