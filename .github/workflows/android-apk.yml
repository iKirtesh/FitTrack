name: Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: APK build type
        required: true
        type: choice
        options:
          - preview
          - development
        default: preview

jobs:
  build:
    name: Build FitTrack Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add Expo project ID to app config
        env:
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
        run: |
          if [ -z "$EXPO_PROJECT_ID" ]; then
            echo "::error::Add EXPO_PROJECT_ID as a GitHub Actions repository variable."
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const file = 'app.json';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.expo.extra = config.expo.extra || {};
          config.expo.extra.eas = {
            ...(config.expo.extra.eas || {}),
            projectId: process.env.EXPO_PROJECT_ID
          };
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Install development client (development APK only)
        if: inputs.profile == 'development'
        run: npx expo install expo-dev-client

      - name: Build Android APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add EXPO_TOKEN as a GitHub Actions repository secret."
            exit 1
          fi
          npx eas-cli@latest build --platform android --profile "${{ inputs.profile }}" --non-interactive
